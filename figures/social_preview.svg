<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>simple-freedom</title><rect width="100%" height="100%" fill="#fcfcfb"/><text x="32.0" y="62.0" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="start" letter-spacing="-0.5">simple-freedom</text><text x="32.0" y="98.0" font-size="19" fill="#52514e" font-weight="400" text-anchor="start" >Two copies of an LLM are told</text><text x="32.0" y="122.0" font-size="19" fill="#0b0b0b" font-weight="600" text-anchor="start" >“You have complete freedom.”</text><text x="32.0" y="146.0" font-size="19" fill="#52514e" font-weight="400" text-anchor="start" >What do they do with it?</text><text x="32.0" y="196.0" font-size="14" fill="#7a7974" font-weight="400" text-anchor="start" >10 models · 132 conversations</text><text x="32.0" y="216.0" font-size="14" fill="#7a7974" font-weight="400" text-anchor="start" >7,200 turns · 5 blind judges</text><text x="32.0" y="290.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start" >Each model drifts into its own loop.</text><text x="330.0" y="40.0" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start" >Given a way out, how fast do they leave?</text><text x="330.0" y="58.0" font-size="12" fill="#7a7974" font-weight="400" text-anchor="start" >turn of first [END], 3 trials per model</text><rect x="410.0" y="76.0" width="19.8" height="214.0" rx="0" fill="#eaf2fc"/><line x1="410.0" y1="76.0" x2="410.0" y2="290.0" stroke="#e6e5e1" stroke-width="1" /><line x1="509.0" y1="76.0" x2="509.0" y2="290.0" stroke="#e6e5e1" stroke-width="1" /><line x1="608.0" y1="76.0" x2="608.0" y2="290.0" stroke="#e6e5e1" stroke-width="1" /><text x="402.0" y="96.6" font-size="12" fill="#0b0b0b" font-weight="400" text-anchor="end" >Qwen</text><line x1="412.0" y1="92.4" x2="421.9" y2="92.4" stroke="#c4c3be" stroke-width="2" stroke-linecap="round"/><line x1="415.9" y1="